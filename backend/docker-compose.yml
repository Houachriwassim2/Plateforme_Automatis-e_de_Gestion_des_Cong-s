version: "3.8"

services:
  backend:
    build: .
    container_name: backend-gestion-conges
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: gestion_conges
      DB_USER: conges
      DB_PASSWORD: conges123
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: db-gestion-conges
    environment:
      MYSQL_DATABASE: gestion_conges
      MYSQL_USER: conges
      MYSQL_PASSWORD: conges123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
